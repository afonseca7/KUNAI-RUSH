<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070912" />
    <title>Kunai Rush</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #070912;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: monospace;
      }

      #letterbox {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #11182c 0%, #070912 75%);
        overflow: hidden;
      }

      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      #app canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
        box-shadow: 0 0 0 2px #162038, 0 12px 36px rgba(0, 0, 0, 0.75);
      }

      #ads-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="letterbox">
      <div id="app"></div>
    </div>
    <div id="ads-overlay" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
